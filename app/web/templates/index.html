<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ProfessorAI — Your Personal AI College Professor</title>
  <meta name="description" content="ProfessorAI: your personal AI college professor, powered by Google Gemini.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%236C8CFF'/%3E%3Cstop offset='1' stop-color='%239B7BFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M6 13l10-5 10 5-10 5z' fill='white'/%3E%3Cpath d='M10 15.5v4.5c0 1.5 3 3 6 3s6-1.5 6-3v-4.5l-6 3z' fill='white' opacity='.85'/%3E%3C/svg%3E">
</head>
<body>
  <div class="app" id="app">
    <!-- ===== Header ===== -->
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20"><path d="M2 9l10-5 10 5-10 5z" fill="currentColor"/><path d="M6 11.5V16c0 1.6 2.7 3 6 3s6-1.4 6-3v-4.5l-6 3z" fill="currentColor" opacity=".8"/></svg>
        </div>
        <div class="brand-text">
          <h1>ProfessorAI</h1>
          <p>Your Personal AI College Professor</p>
        </div>
      </div>
      <div class="status" id="status" role="status" title="Gemini connection status">
        <span class="dot"></span><span class="status-label">Checking…</span>
      </div>
    </header>

    <!-- ===== Sidebar ===== -->
    <aside class="sidebar" id="sidebar" aria-label="Subject and mode">
      <section class="side-section">
        <h2 class="side-title">Subject</h2>
        <ul class="subject-list" id="subjectList"></ul>
      </section>
      <section class="side-section">
        <h2 class="side-title">Response mode</h2>
        <div class="mode-list" id="modeList" role="radiogroup" aria-label="Response mode"></div>
      </section>
      <section class="side-section quiz-settings" id="quizSettings" hidden>
        <h2 class="side-title">Quiz difficulty</h2>
        <div class="segmented" id="difficulty" role="radiogroup" aria-label="Quiz difficulty">
          <button type="button" data-value="easy" role="radio" aria-checked="false">Easy</button>
          <button type="button" data-value="medium" role="radio" aria-checked="true" class="active">Medium</button>
          <button type="button" data-value="hard" role="radio" aria-checked="false">Hard</button>
        </div>
      </section>
    </aside>
    <div class="scrim" id="scrim" hidden></div>

    <!-- ===== Chat ===== -->
    <main class="chat">
      <div class="toolbar">
        <div class="chips">
          <span class="chip" id="subjectChip">General</span>
          <span class="chip chip-mode" id="modeChip">Mode: Normal</span>
          <span class="chip chip-score" id="scoreChip" hidden>Score 0/0</span>
        </div>
        <button class="ghost-btn" id="clearBtn" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12M9 7V4h6v3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Clear chat
        </button>
      </div>

      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="composer" autocomplete="off">
        <div class="composer-box">
          <textarea id="input" rows="1" placeholder="Ask Professor…" aria-label="Your question"></textarea>
          <button class="send-btn" id="sendBtn" type="submit" aria-label="Send">
            <span>Send</span>
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z" fill="currentColor"/></svg>
          </button>
        </div>
        <div class="composer-meta">
          <span id="hint">Enter to send · Shift+Enter for a new line</span>
          <span id="counter">0 / 4000</span>
        </div>
      </form>
    </main>
  </div>

  <!-- Bundled locally so markdown rendering also works offline -->
  <script src="/static/vendor/marked.min.js"></script>
  <script src="/static/vendor/purify.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
